name: scrapnity-prod

networks:
  scrapnity-prod:
    driver: bridge

services:
  scrapnity-prod-phpmyadmin:
    container_name: scrapnity-prod-phpmyadmin
    image: phpmyadmin/phpmyadmin
    ports:
      - "16467:80"
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_PORT: ${PMA_PORT}
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
    networks:
      - scrapnity-prod

volumes:
  database:
