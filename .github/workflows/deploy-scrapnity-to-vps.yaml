name: Deploy Dockerized Web App (Scrapnity) to VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".github/**"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Log in to Docker Hub using PAT
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      # 3. Build and push Docker image with build-time environment variables
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/scrapnity:latest
          file: Dockerfile
          build-args: |
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            APP_HOST=${{ secrets.APP_HOST }}
            RAZOR_PAY_KEY=${{ secrets.RAZOR_PAY_KEY }}
            RAZOR_PAY_SECRET=${{ secrets.RAZOR_PAY_SECRET }}
            VITE_APP_HOST=${{ secrets.VITE_APP_HOST }}
            VITE_RAZOR_PAY_KEY=${{ secrets.VITE_RAZOR_PAY_KEY }}

      # 4. SSH into VPS and deploy
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # --------Pull the latest image--------
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/scrapnity:latest
            # --------Stop and remove any existing container--------
            docker rm -f scrapnity || true
            # --------Run the container with environment variables--------
            docker run -d \
              --name scrapnity \
              -p 3000:3000 \
              -e GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
              -e GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} \
              -e BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }} \
              -e BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }} \
              -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
              -e APP_HOST=${{ secrets.APP_HOST }} \
              -e RAZOR_PAY_KEY=${{ secrets.RAZOR_PAY_KEY }} \
              -e RAZOR_PAY_SECRET=${{ secrets.RAZOR_PAY_SECRET }} \
              -e VITE_APP_HOST=${{ secrets.VITE_APP_HOST }} \
              -e VITE_RAZOR_PAY_KEY=${{ secrets.VITE_RAZOR_PAY_KEY }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/scrapnity:latest
